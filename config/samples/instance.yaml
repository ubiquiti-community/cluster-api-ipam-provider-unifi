apiVersion: unifi.ipam.cluster.x-k8s.io/v1beta2
kind: Instance
metadata:
  name: unifi-controller
  namespace: default
spec:
  # Unifi controller URL
  host: "https://unifi.example.com:8443"

  # Reference to a Secret in this Instance's own namespace. credentialsRef is a
  # LocalObjectReference, so it carries only a name -- a namespace here would be
  # pruned by the API server.
  credentialsRef:
    name: unifi-credentials

  # Unifi site name (optional, defaults to "default")
  site: default

  # Skip TLS verification (optional, defaults to false)
  insecure: false
---
apiVersion: v1
kind: Secret
metadata:
  name: unifi-credentials
  namespace: default
type: Opaque
stringData:
  # The controller and the validating webhook both require the key "apiKey";
  # a Secret without it is rejected. Mint the key in the Unifi controller under
  # Settings -> Admins -> API Key.
  apiKey: your-unifi-api-key-here
